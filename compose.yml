services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile

    image: scholarbuddy-backend:local

    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-8080}:8080"

    environment:
      DB_URL: "${DB_URL:?DB_URL is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}"

      FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"

      HTTP_ADDR: "8080"

    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8080/actuator/health"
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3